name: PR Security Gate Reusable

on:
  workflow_call:
    inputs:
      security-gate-repository:
        description: Repository that contains the PR Security Gate scanner code.
        required: false
        type: string
        default: bharaths97/pr-security-gate
      security-gate-ref:
        description: Git ref to use when checking out the PR Security Gate scanner code.
        required: false
        type: string
        default: main
    secrets:
      github-token:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    name: PR Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PR Security Gate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.security-gate-repository }}
          ref: ${{ inputs.security-gate-ref }}
          path: .pr-security-gate

      - name: Verify PR Security Gate checkout
        run: test -f .pr-security-gate/requirements.txt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PR Security Gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .pr-security-gate/requirements.txt

      - name: Run scoped Semgrep scan
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .pr-security-gate/scanner/run_scan.py \
            --rules .pr-security-gate/rules \
            --output scan-results.json

      - name: Triage findings
        run: |
          python .pr-security-gate/scanner/triage.py \
            --input scan-results.json \
            --output triaged-findings.json

      - name: Comment on pull request
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .pr-security-gate/scanner/comment.py \
            --input triaged-findings.json
