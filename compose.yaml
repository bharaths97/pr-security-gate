name: cicd

services:
  security-gate:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env.ai
        required: false
    environment:
      HOME: /tmp/semgrep-home
      SEMGREP_SETTINGS_FILE: /tmp/semgrep-home/settings.yml
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
